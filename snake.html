<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>My Web Game Store</title><link rel="manifest" href='data:application/json,{
"name":"My Game Store",
"short_name":"Games",
"display":"standalone",
"start_url":".",
"theme_color":"#111827",
"background_color":"#111827",
"icons":[{"src":"icon192.png","sizes":"192x192","type":"image/png"}]
}'><style>

:root{
--bg:#111827;
--card:#1f2937;
--text:white;
--accent:#6366f1;
}

.light{
--bg:#f3f4f6;
--card:white;
--text:#111;
}

body{
margin:0;
font-family:system-ui;
background:var(--bg);
color:var(--text);
transition:.3s;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
font-weight:bold;
font-size:20px;
}

.controls{
display:flex;
gap:8px;
padding:0 16px 16px 16px;
}

input{
flex:1;
padding:10px;
border-radius:8px;
border:none;
}

button{
border:none;
padding:10px 12px;
border-radius:8px;
background:var(--accent);
color:white;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:14px;
padding:16px;
}

.card{
background:var(--card);
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:scale(1.04);
}

.card img{
width:100%;
border-radius:10px;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:100;
}

iframe{
width:100%;
height:100%;
border:none;
}

.close{
position:absolute;
top:10px;
right:10px;
background:red;
color:white;
padding:10px;
border:none;
border-radius:6px;
}

</style></head><body><header>
🎮 My Game Store
<button onclick="toggleTheme()">🌙</button>
</header><div class="controls">
<input id="search" placeholder="Search games">
<button id="installBtn" style="display:none">Install</button>
</div><div id="store" class="grid"></div><div id="player">
<button class="close" onclick="closeGame()">X</button>
<iframe id="gameFrame"></iframe>
</div><script>

/* GAME LIST */

let games=[

{name:"Snake",img:"https://picsum.photos/200?1",url:"#"},
{name:"Flappy Bird",img:"https://picsum.photos/200?2",url:"#"},
{name:"Tetris",img:"https://picsum.photos/200?3",url:"#"},
{name:"2048",img:"https://picsum.photos/200?4",url:"#"},
{name:"Tap Speed",img:"https://picsum.photos/200?5",url:"#"},
{name:"Puzzle Box",img:"https://picsum.photos/200?6",url:"#"},
{name:"Memory Match",img:"https://picsum.photos/200?7",url:"#"},
{name:"Block Drop",img:"https://picsum.photos/200?8",url:"#"},
{name:"Jump Hero",img:"https://picsum.photos/200?9",url:"#"},
{name:"Racer Mini",img:"https://picsum.photos/200?10",url:"#"},
{name:"Color Switch",img:"https://picsum.photos/200?11",url:"#"},
{name:"Speed Click",img:"https://picsum.photos/200?12",url:"#"}

]

/* RENDER */

function render(list){

store.innerHTML=""

list.forEach(g=>{

store.innerHTML+=`

<div class="card" onclick="playGame('${g.url}')">

<img src="${g.img}">

<div>${g.name}</div>

</div>

`

})

}

render(games)

/* SEARCH */

search.oninput=e=>{

let s=e.target.value.toLowerCase()

let filtered=games.filter(g=>
g.name.toLowerCase().includes(s)
)

render(filtered)

}

/* PLAYER */

function playGame(url){

player.style.display="block"
gameFrame.src=url

}

function closeGame(){

player.style.display="none"
gameFrame.src=""

}

/* DARK / LIGHT */

function toggleTheme(){

document.body.classList.toggle("light")

}

/* PWA INSTALL */

let deferred

window.addEventListener("beforeinstallprompt",e=>{

e.preventDefault()

deferred=e

installBtn.style.display="block"

})

installBtn.onclick=()=>{

deferred.prompt()

}

/* SERVICE WORKER */

if("serviceWorker" in navigator){

let sw=`

self.addEventListener('install',e=>self.skipWaiting())

self.addEventListener('fetch',e=>{
e.respondWith(
caches.open('games').then(c=>
c.match(e.request).then(r=>r||fetch(e.request))
)
)
})

`

navigator.serviceWorker.register(
URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))
)

}

</script></body>
</html>
