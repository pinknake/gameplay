<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Candy Crush Saga - ULTIMATE 🍬</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #292f36;
            --light: #f7fff7;
            --purple: #9b59b6;
            --orange: #f39c12;
            --blue: #3498db;
            --red: #e74c3c;
            --green: #2ecc71;
            --yellow: #f1c40f;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        /* Header */
        .game-header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
        }

        .game-title {
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #ffe66d, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        .save-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.2);
            padding: 5px 10px;
            border-radius: 20px;
            display: none;
        }

        .save-indicator.show {
            display: block;
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 5px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            transition: transform 0.2s;
        }

        .stat-item:hover {
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Level Info */
        .level-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 30px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .level-badge {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .target-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 8px 20px;
            border-radius: 25px;
        }

        .target-icon {
            font-size: 24px;
        }

        .target-text {
            font-weight: 600;
            color: #333;
        }

        /* Game Board */
        .board-container {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            padding: 20px;
            border-radius: 30px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.3);
            padding: 10px;
            border-radius: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .cell.selected {
            transform: scale(1.08);
            box-shadow: 0 0 0 4px #ffe66d, 0 8px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .cell.match-animation {
            animation: matchPop 0.3s ease;
        }

        .cell.fall-animation {
            animation: fallDown 0.3s ease;
        }

        .cell.special-animation {
            animation: specialSpin 0.5s ease;
        }

        @keyframes matchPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); }
        }

        @keyframes fallDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes specialSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Candy Colors with Special Effects */
        .candy-red { 
            background: linear-gradient(145deg, #ff6b6b, #ee5253); 
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .candy-blue { 
            background: linear-gradient(145deg, #54a0ff, #2e86de); 
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .candy-green { 
            background: linear-gradient(145deg, #1dd1a1, #10ac84); 
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .candy-yellow { 
            background: linear-gradient(145deg, #feca57, #ff9f43); 
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .candy-purple { 
            background: linear-gradient(145deg, #5f27cd, #341f97); 
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .candy-orange { 
            background: linear-gradient(145deg, #ff9f43, #ee5a24); 
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Special Candy Indicators */
        .candy-special::after {
            content: '✨';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 12px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .btn-success {
            background: linear-gradient(45deg, #1dd1a1, #10ac84);
        }

        .btn-warning {
            background: linear-gradient(45deg, #feca57, #ff9f43);
        }

        .btn-info {
            background: linear-gradient(45deg, #54a0ff, #2e86de);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Combo Counter */
        .combo-counter {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            animation: comboPulse 0.5s infinite;
        }

        @keyframes comboPulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* Level Complete Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 50px;
            text-align: center;
            color: white;
            max-width: 400px;
            width: 90%;
            animation: modalPop 0.5s ease;
            border: 5px solid rgba(255,255,255,0.3);
        }

        @keyframes modalPop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .modal h2 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .modal-stats {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 30px;
            margin: 20px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* Score Popup */
        .score-popup {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 28px;
            animation: floatUp 1s ease forwards;
            pointer-events: none;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            z-index: 2000;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .game-container {
                padding: 10px;
            }
            
            .game-board {
                gap: 3px;
            }
            
            .cell {
                font-size: 24px;
            }
            
            .stat-value {
                font-size: 18px;
            }
            
            .btn {
                padding: 12px;
                font-size: 14px;
                min-width: 80px;
            }
        }
    </style>
</head>

    <script>
        // ==================== GAME CONFIGURATION ====================
        const ROWS = 8;
        const COLS = 8;
        const CANDY_TYPES = [
            { icon: '🍬', color: 'candy-red', name: 'Red' },
            { icon: '🍭', color: 'candy-blue', name: 'Blue' },
            { icon: '🍫', color: 'candy-green', name: 'Green' },
            { icon: '🍪', color: 'candy-yellow', name: 'Yellow' },
            { icon: '🧁', color: 'candy-purple', name: 'Purple' },
            { icon: '🍩', color: 'candy-orange', name: 'Orange' }
        ];

        // Level configurations
        const LEVELS = [
            { target: 1000, moves: 30, name: 'Sweet Start', specialChance: 0 },
            { target: 2000, moves: 28, name: 'Candy Land', specialChance: 0.1 },
            { target: 3000, moves: 26, name: 'Sugar Rush', specialChance: 0.15 },
            { target: 4000, moves: 24, name: 'Chocolate Factory', specialChance: 0.2 },
            { target: 5000, moves: 22, name: 'Caramel Kingdom', specialChance: 0.25 },
            { target: 6000, moves: 20, name: 'Lollipop Woods', specialChance: 0.3 },
            { target: 7000, moves: 18, name: 'Gumdrop Pass', specialChance: 0.35 },
            { target: 8000, moves: 16, name: 'Peppermint Peak', specialChance: 0.4 },
            { target: 9000, moves: 14, name: 'Candy Castle', specialChance: 0.45 },
            { target: 10000, moves: 12, name: 'Sweet Symphony', specialChance: 0.5 }
        ];

        // Game state
        let board = [];
        let specialBoard = []; // Track special candies
        let score = 0;
        let moves = 30;
        let currentLevel = 1;
        let targetScore = 1000;
        let selectedRow = -1;
        let selectedCol = -1;
        let isAnimating = false;
        let gameActive = true;
        let combo = 0;
        let maxCombo = 0;

        // Save state key
        const SAVE_KEY = 'candyCrushUltimate';

        // ==================== INITIALIZE GAME ====================
        function initGame() {
            // Try to load saved game
            if (!loadGame()) {
                createEmptyBoard();
                fillBoard();
            }
            renderBoard();
            updateUI();
        }

        function createEmptyBoard() {
            board = [];
            specialBoard = [];
            for (let i = 0; i < ROWS; i++) {
                board[i] = [];
                specialBoard[i] = [];
                for (let j = 0; j < COLS; j++) {
                    board[i][j] = Math.floor(Math.random() * CANDY_TYPES.length);
                    specialBoard[i][j] = false;
                }
            }
        }

        function fillBoard() {
            // Remove initial matches with proper validation
            let maxAttempts = 100;
            while (hasAnyMatches() && maxAttempts > 0) {
                resolveMatches(true);
                maxAttempts--;
            }
        }

        // ==================== MATCH DETECTION - IMPROVED ====================
        function hasAnyMatches() {
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (getMatchLength(i, j) >= 3) {
                        return true;
                    }
                }
            }
            return false;
        }

        function getMatchLength(row, col) {
            if (board[row][col] === undefined || board[row][col] === -1) return 0;
            
            const candy = board[row][col];
            let horizontalLength = 1;
            let verticalLength = 1;
            
            // Check horizontal
            for (let j = col + 1; j < COLS; j++) {
                if (board[row][j] === candy) horizontalLength++;
                else break;
            }
            for (let j = col - 1; j >= 0; j--) {
                if (board[row][j] === candy) horizontalLength++;
                else break;
            }
            
            // Check vertical
            for (let i = row + 1; i < ROWS; i++) {
                if (board[i][col] === candy) verticalLength++;
                else break;
            }
            for (let i = row - 1; i >= 0; i--) {
                if (board[i][col] === candy) verticalLength++;
                else break;
            }
            
            return Math.max(horizontalLength, verticalLength);
        }

        function getAllMatches() {
            const matches = new Set();
            
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (board[i][j] === undefined || board[i][j] === -1) continue;
                    
                    const candy = board[i][j];
                    
                    // Check horizontal matches
                    if (j <= COLS - 3) {
                        if (board[i][j + 1] === candy && board[i][j + 2] === candy) {
                            let matchLength = 3;
                            while (j + matchLength < COLS && board[i][j + matchLength] === candy) {
                                matchLength++;
                            }
                            
                            for (let k = 0; k < matchLength; k++) {
                                matches.add(`${i},${j + k}`);
                            }
                        }
                    }
                    
                    // Check vertical matches
                    if (i <= ROWS - 3) {
                        if (board[i + 1][j] === candy && board[i + 2][j] === candy) {
                            let matchLength = 3;
                            while (i + matchLength < ROWS && board[i + matchLength][j] === candy) {
                                matchLength++;
                            }
                            
                            for (let k = 0; k < matchLength; k++) {
                                matches.add(`${i + k},${j}`);
                            }
                        }
                    }
                }
            }
            
            return matches;
        }

        // ==================== RENDER BOARD ====================
        function renderBoard() {
            const boardElement = document.getElementById('gameBoard');
            boardElement.innerHTML = '';

            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    const candyIndex = board[i][j];
                    if (candyIndex === undefined || candyIndex === -1) continue;
                    
                    const cell = document.createElement('div');
                    cell.className = `cell ${CANDY_TYPES[candyIndex].color}`;
                    
                    if (specialBoard[i][j]) {
                        cell.classList.add('candy-special');
                    }
                    
                    if (selectedRow === i && selectedCol === j) {
                        cell.classList.add('selected');
                    }
                    
                    cell.textContent = CANDY_TYPES[candyIndex].icon;
                    cell.setAttribute('data-row', i);
                    cell.setAttribute('data-col', j);
                    cell.onclick = () => handleCellClick(i, j);
                    boardElement.appendChild(cell);
                }
            }
        }

        // ==================== CELL CLICK HANDLER ====================
        function handleCellClick(row, col) {
            if (!gameActive || isAnimating) return;

            if (selectedRow === -1) {
                // First selection
                selectedRow = row;
                selectedCol = col;
                renderBoard();
            } else {
                // Second selection - check if adjacent
                if (isAdjacent(selectedRow, selectedCol, row, col)) {
                    // Swap candies
                    swapCandies(selectedRow, selectedCol, row, col);
                }
                
                // Deselect
                selectedRow = -1;
                selectedCol = -1;
                renderBoard();
            }
        }

        function isAdjacent(row1, col1, row2, col2) {
            return (Math.abs(row1 - row2) + Math.abs(col1 - col2)) === 1;
        }

        async function swapCandies(row1, col1, row2, col2) {
            isAnimating = true;

            // Swap
            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;
            
            // Swap special status
            const tempSpecial = specialBoard[row1][col1];
            specialBoard[row1][col1] = specialBoard[row2][col2];
            specialBoard[row2][col2] = tempSpecial;

            renderBoard();
            await sleep(200);

            // Check if match created
            const matches = getAllMatches();
            if (matches.size > 0) {
                moves--;
                await resolveMatches();
                
                // Check for combos
                if (combo > 0) {
                    combo++;
                    showCombo(combo);
                }
            } else {
                // Swap back
                const temp = board[row1][col1];
                board[row1][col1] = board[row2][col2];
                board[row2][col2] = temp;
                
                const tempSpecial = specialBoard[row1][col1];
                specialBoard[row1][col1] = specialBoard[row2][col2];
                specialBoard[row2][col2] = tempSpecial;
                
                renderBoard();
                showToast('No match!', 'error');
                combo = 0;
            }

            isAnimating = false;
            
            // Auto-save after each move
            autoSave();
            
            // Check game state
            checkGameState();
        }

        // ==================== MATCH RESOLUTION - IMPROVED ====================
        async function resolveMatches(initialFill = false) {
            let matchesFound = true;
            let iterationPoints = 0;

            while (matchesFound) {
                matchesFound = false;
                const matches = getAllMatches();
                
                if (matches.size > 0) {
                    matchesFound = true;
                    
                    // Calculate points based on match size
                    const matchGroups = groupMatches(matches);
                    
                    for (let group of matchGroups) {
                        const size = group.length;
                        let points = size * 100;
                        
                        // Bonus for special candies
                        const hasSpecial = group.some(pos => {
                            const [r, c] = pos.split(',').map(Number);
                            return specialBoard[r][c];
                        });
                        
                        if (hasSpecial) points *= 2;
                        
                        // Combo multiplier
                        if (combo > 0) points *= (1 + combo * 0.2);
                        
                        iterationPoints += points;
                        
                        // Create special candy for 4+ matches
                        if (size >= 4 && !initialFill) {
                            const [r, c] = group[0].split(',').map(Number);
                            specialBoard[r][c] = true;
                            showToast('✨ Special Candy Created!', 'success');
                        }
                        
                        // Mark for removal
                        group.forEach(pos => {
                            const [r, c] = pos.split(',').map(Number);
                            board[r][c] = -1;
                            
                            // Animate
                            const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                            if (cell) {
                                cell.classList.add('match-animation');
                            }
                        });
                    }
                    
                    if (!initialFill) {
                        score += iterationPoints;
                        createScorePopup(iterationPoints);
                    }
                    
                    renderBoard();
                    await sleep(300);
                    
                    // Drop candies
                    await dropCandies();
                    
                    // Fill empty spaces
                    fillEmptySpaces();
                    
                    renderBoard();
                    await sleep(200);
                    
                    iterationPoints = 0;
                }
            }
            
            if (!initialFill && matchesFound) {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
            }
            
            updateUI();
        }

        function groupMatches(matches) {
            const groups = [];
            const used = new Set();
            
            matches.forEach(pos => {
                if (!used.has(pos)) {
                    const [r, c] = pos.split(',').map(Number);
                    const group = findConnectedMatch(r, c, board[r][c]);
                    group.forEach(p => used.add(p));
                    groups.push(group);
                }
            });
            
            return groups;
        }

        function findConnectedMatch(row, col, candy) {
            const visited = new Set();
            const queue = [[row, col]];
            
            while (queue.length > 0) {
                const [r, c] = queue.shift();
                const key = `${r},${c}`;
                
                if (visited.has(key)) continue;
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
                if (board[r][c] !== candy) continue;
                
                visited.add(key);
                
                // Check adjacent
                queue.push([r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]);
            }
            
            return Array.from(visited);
        }

        async function dropCandies() {
            for (let col = 0; col < COLS; col++) {
                let emptyRow = ROWS - 1;
                
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (board[row][col] !== -1) {
                        if (row !== emptyRow) {
                            board[emptyRow][col] = board[row][col];
                            specialBoard[emptyRow][col] = specialBoard[row][col];
                            board[row][col] = -1;
                            specialBoard[row][col] = false;
                        }
                        emptyRow--;
                    }
                }
            }
            
            renderBoard();
            await sleep(200);
        }

        function fillEmptySpaces() {
            const levelData = LEVELS[currentLevel - 1];
            
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (board[i][j] === -1) {
                        board[i][j] = Math.floor(Math.random() * CANDY_TYPES.length);
                        
                        // Random special candy based on level
                        if (Math.random() < levelData.specialChance) {
                            specialBoard[i][j] = Math.random() < 0.1;
                        }
                    }
                }
            }
        }

        // ==================== GAME STATE MANAGEMENT ====================
        function checkGameState() {
            // Check if level complete
            if (score >= targetScore) {
                levelComplete();
                return;
            }

            // Check if game over
            if (moves <= 0) {
                gameOver();
                return;
            }

            updateUI();
        }

        function levelComplete() {
            gameActive = false;
            
            // Calculate bonuses
            const moveBonus = moves * 50;
            const comboBonus = maxCombo * 100;
            const totalBonus = moveBonus + comboBonus;
            score += totalBonus;

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('finalBonus').textContent = moveBonus;
            document.getElementById('comboBonus').textContent = comboBonus;
            
            document.getElementById('levelCompleteModal').classList.add('active');
            
            // Auto-save progress
            saveGame();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('gameOverScore').textContent = score;
            document.getElementById('gameOverLevel').textContent = currentLevel;
            document.getElementById('gameOverModal').classList.add('active');
        }

        function nextLevel() {
            if (currentLevel < LEVELS.length) {
                currentLevel++;
                loadLevel(currentLevel);
                showToast(`🎉 Level ${currentLevel} Unlocked!`, 'success');
            } else {
                showToast('🎊 Congratulations! You completed all levels!', 'success');
                newGame();
            }
            closeModal();
        }

        function loadLevel(level) {
            const levelData = LEVELS[level - 1];
            targetScore = levelData.target;
            moves = levelData.moves;
            score = 0;
            combo = 0;
            maxCombo = 0;
            
            createEmptyBoard();
            fillBoard();
            renderBoard();
            updateUI();
            
            gameActive = true;
            showToast(`Level ${level}: ${levelData.name}`, 'info');
        }

        function newGame() {
            currentLevel = 1;
            loadLevel(1);
            closeModal();
            
            // Clear save
            localStorage.removeItem(SAVE_KEY);
            showToast('New Game Started!', 'success');
        }

        function closeModal() {
            document.getElementById('levelCompleteModal').classList.remove('active');
            document.getElementById('gameOverModal').classList.remove('active');
        }

        // ==================== SAVE/LOAD SYSTEM ====================
        function saveGame() {
            const gameState = {
                board,
                specialBoard,
                score,
                moves,
                currentLevel,
                targetScore,
                combo,
                maxCombo,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
            showSaveIndicator();
            showToast('Game Saved!', 'success');
            return true;
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const gameState = JSON.parse(saved);
                    
                    board = gameState.board;
                    specialBoard = gameState.specialBoard || [];
                    score = gameState.score;
                    moves = gameState.moves;
                    currentLevel = gameState.currentLevel;
                    targetScore = gameState.targetScore;
                    combo = gameState.combo || 0;
                    maxCombo = gameState.maxCombo || 0;
                    
                    renderBoard();
                    updateUI();
                    gameActive = true;
                    
                    showToast('Game Loaded!', 'success');
                    return true;
                } catch (e) {
                    console.error('Failed to load game', e);
                }
            }
            return false;
        }

        function autoSave() {
            saveGame();
        }

        function showSaveIndicator() {
            const indicator = document.getElementById('saveIndicator');
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 2000);
        }

        // ==================== UTILITY FUNCTIONS ====================
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            document.getElementById('level').textContent = currentLevel;
            document.getElementById('target').textContent = targetScore;
            document.getElementById('levelBadge').textContent = `LEVEL ${currentLevel}`;
            document.getElementById('targetText').textContent = `${targetScore} POINTS`;
        }

        function hint() {
            if (!gameActive || isAnimating) return;
            
            // Find first valid match
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    // Try horizontal swap
                    if (j < COLS - 1) {
                        swapTemporarily(i, j, i, j + 1);
                        if (getAllMatches().size > 0) {
                            selectedRow = i;
                            selectedCol = j;
                            renderBoard();
                            swapBack(i, j, i, j + 1);
                            showToast('✨ Try swapping these!', 'info');
                            return;
                        }
                        swapBack(i, j, i, j + 1);
                    }

                    // Try vertical swap
                    if (i < ROWS - 1) {
                        swapTemporarily(i, j, i + 1, j);
                        if (getAllMatches().size > 0) {
                            selectedRow = i;
                            selectedCol = j;
                            renderBoard();
                            swapBack(i, j, i + 1, j);
                            showToast('✨ Try swapping these!', 'info');
                            return;
                        }
                        swapBack(i, j, i + 1, j);
                    }
                }
            }
            
            showToast('🤔 No hints available! Try shuffling.', 'error');
        }

        function swapTemporarily(row1, col1, row2, col2) {
            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;
        }

        function swapBack(row1, col1, row2, col2) {
            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;
        }

        function shuffleBoard() {
            if (!gameActive || isAnimating) return;
            
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    board[i][j] = Math.floor(Math.random() * CANDY_TYPES.length);
                    specialBoard[i][j] = false;
                }
            }
            
            renderBoard();
            showToast('Board shuffled!', 'info');
            
            // Check if board is playable
            if (!getAllMatches().size > 0) {
                showToast('No matches available. Shuffling again...', 'info');
                shuffleBoard();
            }
        }

        function createScorePopup(points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = `+${points}`;
            popup.style.left = '50%';
            popup.style.top = '50%';
            popup.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
            }, 1000);
        }

        function showCombo(combo) {
            const container = document.getElementById('comboContainer');
            container.innerHTML = `<div class="combo-counter">🔥 COMBO x${combo}</div>`;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 2000);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ==================== INITIALIZE ====================
        document.addEventListener('DOMContentLoaded', () => {
            initGame();
            
            // Add keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    hint();
                } else if (e.key === 'r' || e.key === 'R') {
                    shuffleBoard();
                } else if (e.key === 'n' || e.key === 'N') {
                    newGame();
                } else if (e.key === 's' || e.key === 'S') {
                    saveGame();
                } else if (e.key === 'l' || e.key === 'L') {
                    loadGame();
                }
            });

            // Prevent zoom on double tap
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        });

        // Save before unload
        window.addEventListener('beforeunload', () => {
            saveGame();
        });
    </script>
</body>
</html>
