<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>PinkSnake Game Store</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.search{
padding:10px;
}

.search input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#111827;
border-radius:12px;
padding:10px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.card button{
margin-top:8px;
width:100%;
padding:8px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
cursor:pointer;
}

.ad{
text-align:center;
margin:10px;
}

</style>

</head>

<body>

<header>
🎮 PinkSnake Game Store
</header>

</div>


<div class="search">

<div class="grid">

</div>

</div>

</div>
