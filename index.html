<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PinkSnake Games</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#020617;
padding:20px;
font-size:26px;
}

canvas{
background:black;
margin:20px;
border-radius:10px;
}

button{
padding:10px 16px;
margin:10px;
border:none;
border-radius:6px;
background:#22c55e;
color:white;
}

</style>

</head>

<body>

<header>🎮 PinkSnake Game Hub</header>

<h2>🐍 Snake Game</h2>
<canvas id="snake" width="300" height="300"></canvas>

<h2>🕹 Flappy Game</h2>
<canvas id="flappy" width="300" height="300"></canvas>

<h2>🎯 Reaction Game</h2>
<p id="reactionText">Click start</p>
<button onclick="startReaction()">Start</button>

<script>

/* SNAKE GAME */

const canvas=document.getElementById("snake");
const ctx=canvas.getContext("2d");

let snake=[{x:150,y:150}];
let food={x:90,y:90};
let dx=10;
let dy=0;

function drawSnake(){

ctx.fillStyle="black";
ctx.fillRect(0,0,300,300);

ctx.fillStyle="lime";

snake.forEach(s=>{
ctx.fillRect(s.x,s.y,10,10);
});

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,10,10);

let head={x:snake[0].x+dx,y:snake[0].y+dy};

snake.unshift(head);

if(head.x===food.x && head.y===food.y){

food.x=Math.floor(Math.random()*30)*10;
food.y=Math.floor(Math.random()*30)*10;

}else{
snake.pop();
}

}

setInterval(drawSnake,120);

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp"){dx=0;dy=-10;}
if(e.key==="ArrowDown"){dx=0;dy=10;}
if(e.key==="ArrowLeft"){dx=-10;dy=0;}
if(e.key==="ArrowRight"){dx=10;dy=0;}

});

/* FLAPPY GAME */

const fcanvas=document.getElementById("flappy");
const fctx=fcanvas.getContext("2d");

let y=150;
let gravity=1;

function drawFlappy(){

fctx.fillStyle="black";
fctx.fillRect(0,0,300,300);

gravity+=0.2;
y+=gravity;

fctx.fillStyle="yellow";
fctx.fillRect(140,y,20,20);

if(y>280){y=150;gravity=1;}

}

setInterval(drawFlappy,30);

document.addEventListener("click",()=>{

gravity=-5;

});

/* REACTION GAME */

let startTime;

function startReaction(){

document.getElementById("reactionText").innerText="Wait...";

setTimeout(()=>{

document.getElementById("reactionText").innerText="CLICK!";

startTime=new Date().getTime();

document.body.onclick=function(){

let end=new Date().getTime();

alert("Reaction time: "+(end-startTime)+" ms");

document.body.onclick=null;

}

},Math.random()*3000+2000);

}

</script>

</body>
</html>
