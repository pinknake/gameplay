<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinkSnake Game Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
padding:20px;
background:#020617;
text-align:center;
font-size:26px;
}

#search{
width:250px;
padding:10px;
border:none;
border-radius:6px;
}

.store{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
width:200px;
border-radius:10px;
padding:10px;
text-align:center;
}

.card img{
width:100%;
border-radius:6px;
}

.card button{
margin-top:10px;
padding:8px;
border:none;
background:#22c55e;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
🎮 PinkSnake Game Store
<br><br>
<input id="search" placeholder="Search game..." onkeyup="searchGame()">
</header>

<div class="store" id="store"></div>

<script>

let games=[]

fetch("games.json")
.then(res=>res.json())
.then(data=>{

games=data
showGames(data)

})

function showGames(list){

let store=document.getElementById("store")
store.innerHTML=""

list.forEach(g=>{

store.innerHTML+=`

<div class="card">
<img src="${g.img}">
<h3>${g.name}</h3>
<button onclick="play('${g.url}')">Play</button>
</div>

`

})

}

function play(url){

location.href="play.html?game="+url

}

function searchGame(){

let s=document.getElementById("search").value.toLowerCase()

let filtered=games.filter(g=>g.name.toLowerCase().includes(s))

showGames(filtered)

}

</script>

</body>
</html>
