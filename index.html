<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PinkSnake Game Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:20px;
text-align:center;
font-size:24px;
}

#search{
padding:10px;
width:220px;
border-radius:6px;
border:none;
}

.store{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
width:180px;
border-radius:10px;
padding:10px;
text-align:center;
}

.card img{
width:100%;
border-radius:6px;
}

.card button{
margin-top:10px;
padding:8px;
border:none;
background:#22c55e;
color:white;
border-radius:6px;
cursor:pointer;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
}

iframe{
width:100%;
height:100%;
border:none;
}

.close{
position:absolute;
top:10px;
right:10px;
padding:10px;
background:red;
color:white;
border:none;
}

</style>

</head>

<body>

<header>
🎮 PinkSnake Game Store
<br><br>
<input id="search" placeholder="Search game..." onkeyup="searchGame()">
</header>

<div class="store" id="store"></div>

<div id="player">
<button class="close" onclick="closeGame()">X</button>
<iframe id="gameFrame"></iframe>
</div>

<script>

let games=[

{
name:"Snake Game",
img:"https://i.imgur.com/7UuJ+8.png",
url:"https://playsnake.org/"
},

{
name:"Flappy Bird",
img:"https://i.imgur.com/7UuJ+8.png",
url:"https://flappybird.io/"
},

{
name:"Tetris",
img:"https://i.imgur.com/7UuJ+8.png",
url:"https://tetris.com/play-tetris"
}

]

function showGames(list){

let store=document.getElementById("store")
store.innerHTML=""

list.forEach(g=>{

store.innerHTML+=`

<div class="card">
<img src="${g.img}">
<h3>${g.name}</h3>
<button onclick="playGame('${g.url}')">Play</button>
</div>

`

})

}

function playGame(url){

document.getElementById("player").style.display="block"
document.getElementById("gameFrame").src=url

}

function closeGame(){

document.getElementById("player").style.display="none"
document.getElementById("gameFrame").src=""

}

function searchGame(){

let s=document.getElementById("search").value.toLowerCase()

let filtered=games.filter(g=>g.name.toLowerCase().includes(s))

showGames(filtered)

}

showGames(games)

</script>

</body>
</html>
