<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinkSnake Gameplay</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
text-align:center;
transition:0.3s;
}

header{
padding:20px;
background:#020617;
font-size:24px;
}

button{
padding:10px 18px;
margin:10px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.darkbtn{
background:#22c55e;
color:white;
}

.gamebtn{
background:#3b82f6;
color:white;
}

#gameBox{
margin-top:40px;
}

#score{
font-size:22px;
margin:20px;
}

/* LIGHT MODE */

.light{
background:#f1f5f9;
color:#111;
}

.light header{
background:#e2e8f0;
}

</style>

</head>

<body>

<header>
🎮 PinkSnake Gameplay
</header>

<button class="darkbtn" onclick="toggleMode()">🌙 Toggle Dark Mode</button>

<div id="gameBox">

<h2>Click Game</h2>

<p>Click the button and increase your score!</p>

<div id="score">Score: 0</div>

<button class="gamebtn" onclick="addScore()">CLICK ME</button>

</div>

<script>

let score = 0;

function addScore(){
score++;
document.getElementById("score").innerText="Score: "+score;
}

function toggleMode(){
document.body.classList.toggle("light");
}

</script>

</body>
</html>
