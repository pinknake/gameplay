<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Crush Pro</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#111827;
padding:14px;
font-size:22px;
font-weight:bold;
}

#game{
display:grid;
grid-template-columns:repeat(8,50px);
gap:6px;
justify-content:center;
margin-top:20px;
}

.cell{
width:50px;
height:50px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.cell:hover{
transform:scale(1.1);
}

.red{background:#ef4444}
.blue{background:#3b82f6}
.green{background:#22c55e}
.yellow{background:#eab308}
.purple{background:#a855f7}

#info{
margin-top:10px;
font-size:18px;
}

#adtop,#adbottom{
margin:10px;
}

button{
margin-top:12px;
padding:8px 14px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<header>🍬 Sweet Crush Pro</header>

<div id="adtop">
<!-- paste your top ad code -->
</div>

<div id="info">
Level: <span id="level">1</span> |
Score: <span id="score">0</span>
</div>

<div id="game"></div>

<button onclick="startGame()">Restart</button>

<div id="adbottom">
<!-- paste bottom ad code -->
</div>

<script>

const width=8
const colors=["red","blue","green","yellow","purple"]
let board=[]
let selected=null
let score=0
let level=1

const game=document.getElementById("game")

function beep(freq){
let ctx=new AudioContext()
let osc=ctx.createOscillator()
osc.frequency.value=freq
osc.connect(ctx.destination)
osc.start()
setTimeout(()=>osc.stop(),120)
}

function randomColor(){
return colors[Math.floor(Math.random()*colors.length)]
}

function createBoard(){

board=[]
game.innerHTML=""

for(let i=0;i<width*width;i++){

let color=randomColor()
board.push(color)

let cell=document.createElement("div")
cell.className="cell "+color
cell.dataset.id=i

cell.onclick=()=>selectCell(i)

game.appendChild(cell)

}

}

function drawBoard(){

document.querySelectorAll(".cell").forEach((c,i)=>{

c.className="cell "+board[i]

})

}

function selectCell(i){

if(selected==null){
selected=i
return
}

swap(selected,i)
selected=null

}

function swap(a,b){

let temp=board[a]
board[a]=board[b]
board[b]=temp

drawBoard()

checkMatches()

}

function checkMatches(){

let matched=false

for(let i=0;i<board.length;i++){

if(board[i]==board[i+1] && board[i]==board[i+2]){

score+=20
matched=true
beep(400)

board[i]=randomColor()
board[i+1]=randomColor()
board[i+2]=randomColor()

}

}

if(matched){

document.getElementById("score").textContent=score

if(score>level*200 && level<10){

level++
document.getElementById("level").textContent=level
beep(700)

}

drawBoard()

}

}

function startGame(){

score=0
level=1

document.getElementById("score").textContent=0
document.getElementById("level").textContent=1

createBoard()

}

startGame()

</script>

</body>
</html>
